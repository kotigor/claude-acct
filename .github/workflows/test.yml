name: test
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq xxd shellcheck
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: shellcheck
        run: shellcheck -x bin/claude-acct bin/claude-acct-browser lib/*.sh install.sh uninstall.sh tests/run.sh tests/lib.sh tests/*.test.sh tests/fakes/*
      - name: tests
        run: tests/run.sh
